# Role namespace-read in shop. get, list, watch only. Does not name secrets.
# Check upstream docs before you add a resource or a verb.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-read
  namespace: shop
  labels:
    app.kubernetes.io/name: namespace-read
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - services
  - configmaps
  - events
  - persistentvolumeclaims
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
