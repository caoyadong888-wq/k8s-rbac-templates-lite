# Filled example. RoleBinding checkout-read -> Role checkout-read for ServiceAccount checkout/checkout-read.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkout-read
  namespace: checkout
  labels:
    app.kubernetes.io/name: checkout-read
subjects:
- kind: ServiceAccount
  name: checkout-read
  namespace: checkout
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: checkout-read
